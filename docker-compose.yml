services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: house_cleaning_booking
      MYSQL_USER: housecleaner
      MYSQL_PASSWORD: housecleaner123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: housecleaner
      DB_PASSWORD: housecleaner123
      DB_NAME: house_cleaning_booking
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - '4000:4000'

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
    depends_on:
      - backend
    ports:
      - '5173:80'

volumes:
  mysql_data: